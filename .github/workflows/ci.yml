name: Java CI

on:
  push:
  pull_request:
  release:
    types:
      - created

permissions:
  contents: write

jobs:
  buildJar:
    name: Build and Publish Jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build mod artifact
        run: |
          chmod +x gradlew
          ./gradlew deploy
      - name: Read artifact name
        id: artifact
        shell: bash
        run: |
          mod_artifact=$(sed -nE 's/^[[:space:]]*modArtifact[[:space:]]*=[[:space:]]*(.*)/\1/p' gradle.properties | tr -d '\r')
          test -n "$mod_artifact" || { echo "Missing modArtifact in gradle.properties"; exit 1; }
          echo "name=${mod_artifact}.jar" >> "$GITHUB_OUTPUT"
      - name: Upload built mod artifact as a GitHub Action artifact
        uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/libs/${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          archive: false
      - name: Upload built mod artifact into release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release' && github.event.action == 'created'
        with:
          files: build/libs/${{ steps.artifact.outputs.name }}
