##### Project configurations.
# The mod's fetched entity sources package.
modFetch = minedusty.fetched
# The mod's input entity sources package.
modGenSrc = minedusty.entities.comp
# The mod's generated sources package.
modGen = minedusty.gen
# The mod's JAR file name. Desktop build is suffixed with `Desktop`.
modArtifact = MineDusty

# EntityAnno version, for integrating syntax-downgrader and entity annotation processor.
# The exact version you need should be looked up on the project's `README.md`
# (see https://github.com/GglLfr/EntityAnno?tab=readme-ov-file#version-compatibility).
entVersion = v2.5.0+v160
# MindustryClient version, for installing and running mindustry clients.
clientVersion = v1.1.3
# Mindustry version: `latest` for latest release, `v159.7` for specific release versions, `be` for bleeding edge.
mindustryVersion = v160.7

# Which version of .jar file to use when running the game. Should follow `mindustryVersion`
applicationVersion = v160.7

##### Android SDK configuration for building Android artifacts.
# Android platform SDK version.
androidSdkVersion = 37.0
# Android build-tools version.
androidBuildVersion = 37.0.0
# Android platform minimum API version. Should be left as 21, as that's what Mindustry officially supports.
androidMinVersion = 21
# Where Mindustry client JARS to be downloaded
mindustryInstallPath = client/
# Ignore using STEAM to run the client (I prefer the client jars)
mindustryIgnoreSteam = true

##### Other stuff that should be left as-is.
# Enable parallel compilation.
org.gradle.parallel = true
# Necessary internal API access for EntityAnno.
org.gradle.jvmargs = \
-Dfile.encoding=UTF-8 \
--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED \
--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED \
--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED
# Enable configuration cache...
org.gradle.configuration-cache = true
# Fail on configuration cache problems...
org.gradle.configuration-cache.problems = fail